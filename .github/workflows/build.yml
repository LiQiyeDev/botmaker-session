name: Build

# The unconditional gate: every push and every PR compiles this module and runs its unit tests.
# Nothing else in the refactor is verifiable without it (docs/refactor/02-execution-order.md, Phase 0).
#
# botmaker-shared is resolved from source, not from JitPack. This repo's pom pins
# ${botmaker.shared.version} = 0.0.0-SNAPSHOT — the version the umbrella reactor and a local
# `mvn install` produce — so there is no published artifact under that coordinate to download.
# Building shared's main branch here means CI tests the same pairing a maintainer tests locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install botmaker-shared (0.0.0-SNAPSHOT)
        run: mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests

      - name: Verify
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
