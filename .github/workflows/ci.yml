name: CI

# One workflow per repo. `build` runs on every push and PR; `live` is the nested-session suite, kept but
# moved off the push path (see below). They were separate files (build.yml + session-live.yml) purely
# because their triggers differ, which a job-level `if:` expresses just as well.
#
# Tests are deliberately NOT run in `build` (`-DskipTests`): CI is a compile gate, and the suite is run
# locally. -DskipTests still *compiles* the tests, so test code that no longer builds is still caught.
#
# botmaker-shared is resolved from source, not from JitPack. This repo's pom pins
# ${botmaker.shared.version} = 0.0.0-SNAPSHOT — the version the umbrella reactor and a local
# `mvn install` produce — so there is no published artifact under that coordinate to download.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # RETRIED — Maven Central answers 429 to GitHub-hosted runners; see .github/mvn-retry.sh.
      - name: Install botmaker-shared (0.0.0-SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests

      - name: Build
        run: mvn -B -DskipTests package

  # The nested-session supervisor proven end-to-end, headlessly: Xvfb is the host X server, our Xephyr :N
  # nests inside it, so the same live NestedSessionLiveTest a maintainer runs on their desktop runs
  # unattended here. GitHub runners have no per-user systemd/session bus, so SessionReaper takes its
  # ProcessBuilder descendant-kill fallback (the systemd --scope path is exercised on the real box) —
  # either way the test asserts zero orphan Xephyr.
  #
  # **Run it from the Actions tab** (Run workflow). It is the one test job kept in CI because it proves
  # something no local run of `mvn test` does — a clean-room machine with no session bus — but it is off
  # the push path with the rest of the suite, so it costs a deliberate click rather than every commit.
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # RETRIED — Maven Central answers 429 to GitHub-hosted runners; see .github/mvn-retry.sh.
      - name: Install botmaker-shared (0.0.0-SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests

      - name: Install the nested-display stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xserver-xephyr openbox \
            x11-utils x11-xserver-utils x11-apps xterm xdotool xauth

      - name: Run the live session suite under Xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            mvn -B test \
              -Dtest=NestedSessionLiveTest \
              -Dbotmaker.live=true \
              -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # The GitHub Release, published by JReleaser from the tag the umbrella's release.sh pushed.
  #
  # It runs HERE and not from the umbrella working copy for a measured reason, recorded in jreleaser.yml:
  # in a submodule checkout `.git` is a FILE (`gitdir: ../.git/modules/<mod>`) and JReleaser's JGit reports
  # "repository not found", while --git-root-search gets past it only by resolving the UMBRELLA repository.
  # A CI checkout is standalone, so neither problem exists. The tag itself stays release.sh's, because tag
  # ORDER across the eight repositories is the one thing JReleaser has no way to express.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else. A missing section exits non-zero and fails the job,
      # which is the right outcome — release.sh should already have refused it.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      # The version comes from the tag via JRELEASER_PROJECT_VERSION above, never from the pom: JitPack
      # serves every tag as com.github.LiQiyeDev:<repo>:<tag> and the pom's <version> is cosmetic.
      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
